name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned IPA
        run: |
          xcodebuild clean build \
            -project mondrdar.xcodeproj \
            -scheme mondrdar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r mondrdar.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mondrdar-IPA
          path: mondrdar.ipa
